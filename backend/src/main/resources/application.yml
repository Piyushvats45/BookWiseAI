spring:
  application:
    name: bookwise-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookwise}
    username: ${DB_USER:bookwise}
    password: ${DB_PASSWORD:bookwise}
    hikari:
      connection-init-sql: SET hnsw.iterative_scan = relaxed_order

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  ai:
    model:
      chat: openai
      embedding: none

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: ${CHAT_MODEL:openai/gpt-oss-20b}

    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768
            task-type: RETRIEVAL_DOCUMENT

    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:768}

